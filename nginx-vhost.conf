# =========================================================================
# Host Nginx Configuration Template for cognitive.iwareid.com
# Put this file in /etc/nginx/sites-available/cognitive.iwareid.com on VPS
# and link it to /etc/nginx/sites-enabled/
# =========================================================================

# HTTP Server Block (Redirects to HTTPS)
server {
    listen 80;
    server_name cognitive.iwareid.com;

    # Certbot verification path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Production Web Traffic)
server {
    listen 443 ssl http2;
    server_name cognitive.iwareid.com;

    # SSL Configuration (Uncomment and update paths after running certbot)
    # ssl_certificate /etc/letsencrypt/live/cognitive.iwareid.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cognitive.iwareid.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size (increase if you plan to upload large files, like images/PDFs)
    client_max_body_size 10M;

    # Next.js Frontend Proxy (Port 8085)
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express.js Backend API Proxy (Port 5002)
    location /api {
        proxy_pass http://127.0.0.1:5002/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
